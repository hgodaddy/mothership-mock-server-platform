services:
  mmsp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mmsp-api
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      PLATFORM_NAME: MMSP
      PLATFORM_VERSION: 0.1.0
      DEFAULT_SCENARIO: success
      DEFAULT_LATENCY_MS: 50
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: INFO
      SPRING_PROFILES_ACTIVE: docker
      MMSP_API_KEY_ENABLED: "false"
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  redis:
    image: redis:7-alpine
    container_name: mmsp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  redis-data:
